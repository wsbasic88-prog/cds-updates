<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#1b1f2a;--mute:#6b7280;--line:#d9dde5;--bg:#d1d5db;--card:#fff;--pri:#1d4ed8;--ok:#15803d;--bad:#b91c1c}
*{box-sizing:border-box}
body{margin:0;font:14px/1.45 Poppins,system-ui,sans-serif;color:var(--ink);background:var(--bg)}
[hidden]{display:none!important}
h2{font-size:26px;margin:0 0 16px}h2 small{font-size:14px;font-weight:400;color:var(--mute);margin-left:8px}
button,input,select{font:inherit}
button{cursor:pointer;border:1.5px solid var(--ink);background:#fff;color:var(--ink);padding:7px 16px;border-radius:8px;font-weight:500}
button:hover{background:#eef0f5}button.pri{background:var(--ink);color:#fff}button.pri:hover{background:#000}
button.sm{padding:3px 12px;font-size:12px}
:focus-visible{outline:2px solid var(--pri);outline-offset:2px}
input,select{width:100%;padding:8px 10px;border:1.5px solid var(--ink);border-radius:8px;background:#fff}
label{display:block;font-weight:500;font-size:12.5px}label input,label select{margin-top:4px;font-weight:400}
header{display:flex;align-items:center;gap:20px;padding:12px 28px;background:var(--ink);color:#fff;flex-wrap:wrap}
header b{font-size:18px;display:flex;align-items:center;gap:10px}header b img{height:30px;width:auto;display:block}#loginLogo{max-height:70px;max-width:200px;width:auto;margin:0 auto 4px;display:block}#loginLogo[hidden]{display:none}nav{display:flex;gap:6px;flex:1;flex-wrap:wrap}
nav button{border:0;background:transparent;color:#cbd0dc;border-radius:6px}
nav button.on{background:#fff;color:var(--ink)}
nav button:hover{background:#2c3342;color:#fff}nav button.on:hover{background:#fff;color:var(--ink)}header>button:hover{background:#2c3342}
#dlg .fl{max-height:260px;overflow:auto;text-align:left;margin:0 0 18px;border:1px solid var(--line);border-radius:10px}#dlg .fl div{padding:8px 12px;border-bottom:1px solid var(--line);font-size:13px}#dlg .fl div:last-child{border-bottom:0}#dlg .fl small{display:block;color:var(--mute)}header>button{background:transparent;color:#fff;border-color:#fff}
main{padding:24px 28px;max-width:2000px;margin:auto}
.card{background:var(--card);border:1.5px solid var(--ink);border-radius:18px;padding:18px}
.split{display:grid;grid-template-columns:380px minmax(0,1fr);gap:24px;align-items:start}
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px}.full{grid-column:1/-1}
.btns{display:flex;justify-content:flex-end;gap:8px;margin-top:6px}
.tw{padding:0;overflow:auto;max-height:68vh}
table{border-collapse:collapse;width:100%;white-space:nowrap}
#ot .tw,#pt .tw,#lt .tw,#mt .tw{overflow-x:auto;max-height:none}#ot table,#pt table,#lt table,#mt table{white-space:nowrap;font-size:12.5px}#ot th,#ot td,#pt th,#pt td,#lt th,#lt td,#mt th,#mt td{padding:8px 8px;vertical-align:middle}#ot td:nth-child(4),#pt td:nth-child(4),#lt td:nth-child(4),#mt td:nth-child(4),#ot td:nth-child(7),#pt td:nth-child(7),#lt td:nth-child(7),#mt td:nth-child(7),#ot td:nth-child(10),#pt td:nth-child(10),#lt td:nth-child(10),#mt td:nth-child(10),#ot td:nth-child(13),#pt td:nth-child(13),#lt td:nth-child(13),#mt td:nth-child(13){white-space:normal;min-width:110px}#ot td:last-child,#ot th:last-child{white-space:nowrap}
@media(max-width:1600px){.split:has(#pt),.split:has(#ot){grid-template-columns:1fr}.split:has(#pt) .form,.split:has(#ot) .form{max-width:560px}}

th.srt{cursor:pointer;user-select:none}th.srt:hover{background:#eef1f6}th.srt.cur{background:#e3eafc}th .ar{font-style:normal;font-size:9px;margin-left:6px;opacity:.75}
th{position:sticky;top:0;background:#fff;text-align:left;font-size:12.5px;padding:11px 12px;border-bottom:1.5px solid var(--ink)}
td{padding:9px 12px;border-bottom:1px solid var(--line)}
th+th,td+td{border-left:1px solid var(--line)}
tbody tr:hover{background:#f7f8fb}tbody tr.on{background:#dbe6ff}
.empty{text-align:center;color:var(--mute);padding:40px}
.bar{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}
.top{display:flex;gap:12px;margin-bottom:16px}.flt{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin:-4px 0 16px}.flt label{flex:1 1 150px;min-width:130px;margin:0}.flt button{height:38px}.top input{flex:1;border-radius:12px;padding:11px 16px}
.tag{font-size:12px;color:var(--ok);font-weight:600}.muted{color:var(--mute);font-size:12px}
#login{min-height:100vh;display:grid;place-items:center;padding:20px;background:var(--ink)}
#login form{width:340px;display:grid;gap:14px}#login form[hidden]{display:none}.err.ok{color:var(--ok)}#login h1{margin:0}
.err{color:var(--bad);font-size:13px;min-height:18px}
#modal{position:fixed;inset:0;background:#0007;display:grid;place-items:center;padding:20px;z-index:5}
#modal .card{width:460px;max-width:100%;max-height:90vh;overflow:auto}
dl{display:grid;grid-template-columns:140px 1fr;gap:6px 12px;margin:0 0 14px}dt{color:var(--mute)}dd{margin:0}
#toast{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:20;display:flex;align-items:center;gap:14px;min-width:260px;max-width:min(440px,90vw);padding:18px 26px 18px 20px;border-radius:18px;background:rgba(255,255,255,.97);color:var(--ink);font-weight:500;font-size:15px;box-shadow:0 20px 60px #0003,0 2px 8px #0002;border:1px solid var(--line);pointer-events:none;animation:pop .22s cubic-bezier(.2,.9,.3,1.2)}
#toast .ti{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--ok);color:#fff;font-size:18px;font-weight:700}
#toast.bad .ti{background:var(--bad)}
#toast.bad{border-color:#f3c5c5}
@keyframes pop{from{opacity:0;transform:translate(-50%,-46%) scale(.92)}to{opacity:1;transform:translate(-50%,-50%) scale(1)}}
#dlg{position:fixed;inset:0;background:#0f172a66;backdrop-filter:blur(3px);display:grid;place-items:center;padding:20px;z-index:30}
#dlg[hidden]{display:none}
#dlg .box{width:400px;max-width:100%;background:#fff;border-radius:20px;padding:28px 26px 22px;text-align:center;box-shadow:0 24px 70px #0004;animation:pop2 .2s cubic-bezier(.2,.9,.3,1.2)}
#dlg .ic{width:52px;height:52px;margin:0 auto 14px;border-radius:50%;display:grid;place-items:center;background:#fef3c7;color:#b45309;font-size:26px;font-weight:700}
#dlg h3{margin:0 0 6px;font-size:18px}#dlg p{margin:0 0 22px;color:var(--mute);white-space:pre-line}
button:disabled{opacity:.4;cursor:not-allowed}
#dlg .box.danger .ic{background:#fee2e2;color:var(--bad)}#dlg .row button.dng{background:var(--bad);border-color:var(--bad);color:#fff}#dlg .row button.dng:hover{background:#991b1b}
#dlg .row{display:flex;gap:10px;justify-content:center}#dlg .row button{min-width:110px;padding:9px 18px}
@keyframes pop2{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:scale(1)}}
.dt{position:relative;margin-top:4px}.dt .dti{margin-top:0;padding-right:38px}.dt .dtt{margin-top:0;padding-right:34px!important}
.cal{position:absolute;right:3px;top:50%;transform:translateY(-50%);border:0;background:transparent;padding:5px 7px;line-height:0;color:var(--ink)}
.pk{position:absolute;right:0;bottom:0;width:1px;height:1px;opacity:0;pointer-events:none}
.grid5{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
textarea{width:100%;margin-top:4px;padding:8px 10px;border:1.5px solid var(--ink);border-radius:8px;font:inherit;font-weight:400;resize:vertical;background:#fff}
.pt{width:100%;border-collapse:collapse;font-size:10px;white-space:normal;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.pt thead{display:table-header-group}.pt tfoot{display:table-row-group}.pt tr{break-inside:avoid}
.rh{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:2px solid #000;padding-bottom:6px;margin-bottom:8px}
.pt th,.pt td{border:1px solid #888;padding:4px 6px;position:static;background:#fff}
.pt th{background:#e6e6e6}.pt tfoot td{font-weight:600;border-top:2px solid #000;background:#f0f0f0}
#printArea{display:none}
@media print{body>*:not(#printArea){display:none!important}#printArea{display:block;color:#000}@page{size:landscape;margin:10mm 10mm 14mm;@bottom-right{content:"Page " counter(page) " of " counter(pages);font:9px sans-serif}}}
@media(max-width:900px){.split{grid-template-columns:1fr}main{padding:16px}}
/* top tabs: JOB ORDER | PLATES | SETTINGS */
#top{display:flex;gap:6px;padding:10px 28px 0}
#top button{border:0;background:#e6e9f1;color:#4b5263;padding:9px 28px 10px;font-size:11.5px;font-weight:600;letter-spacing:.4px;border-radius:14px 14px 0 0;transition:background .15s,color .15s}
#top button:hover{background:#d9deea;color:var(--ink)}
#top button.on,#top button.on:hover{background:var(--ink);color:#fff}
header{border-top-right-radius:0}
nav button{border-radius:10px}
header b:empty{display:none}
/* Job Order pages */
#joRoot table{font-size:12px}#joRoot th,#joRoot td{padding:8px 9px}
#joRoot .jflt{display:grid;grid-template-columns:minmax(200px,3fr) repeat(5,minmax(130px,1fr));gap:10px;margin-bottom:12px}
#joRoot .jflt.lsd{grid-template-columns:minmax(200px,3fr) repeat(4,minmax(130px,1fr))}
#joRoot .jstats{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin-bottom:16px}
.jstat{--tc:#4f6fa8;--tb:#e3edfb;--tl:#b9cff0;background:var(--tb);border:2px solid var(--tl);border-left:8px solid var(--tc);border-radius:16px;padding:16px 20px;box-shadow:0 2px 8px #0000000f}
.jstat span{display:block;color:var(--tc);font-size:14px;font-weight:600;letter-spacing:.2px}.jstat b{display:block;font-size:44px;line-height:1.15;color:var(--tc)}
.jstats .jstat:nth-child(2){--tc:#4f9a76;--tb:#e0f4ea;--tl:#b7e1cc}.jstats .jstat:nth-child(3){--tc:#c4934a;--tb:#fdf1d9;--tl:#f3dcaa}.jstats .jstat:nth-child(4){--tc:#c76a74;--tb:#fde4e6;--tl:#f4bcc2}
.jstats .jstat:nth-child(5){--tc:#8c76c2;--tb:#ece6fa;--tl:#cfc3ee}.jstats .jstat:nth-child(6){--tc:#7d8594;--tb:#eceef2;--tl:#cdd1d9}

function ask(msg,okText='Yes, continue',title='Please confirm',danger=false){   // styled replacement for confirm(); danger = CANCEL / DELETE (focus starts on "No")
  return new Promise(res=>{
    const d=$('#dlg');
    d.innerHTML=`<div class="box${danger?' danger':''}" role="dialog" aria-modal="true"><div class="ic">${danger?'!':'?'}</div><h3>${esc(title)}</h3>${msg?`<p>${esc(msg)}</p>`:''}<div class="row"><button id="dn">${danger?'No':'Cancel'}</button><button class="${danger?'dng':'pri'}" id="dy">${esc(okText)}</button></div></div>`;
    d.hidden=false;
    const done=v=>{d.hidden=true;document.removeEventListener('keydown',k,true);res(v)};
    const k=e=>{if(e.key==='Escape'){e.preventDefault();done(false)}else if(e.key==='Enter'&&!danger){e.preventDefault();done(true)}};
    document.addEventListener('keydown',k,true);
    $('#dn').onclick=()=>done(false);$('#dy').onclick=()=>done(true);
    d.onclick=e=>{if(e.target===d)done(false)};

  });
}

function downloadPdf(o){                               // builds a landscape A4 PDF (title band, optional stat boxes, table, page numbers) and saves it
  try{
    const J=window.jspdf;if(!J||!J.jsPDF)throw new Error('PDF tool did not load. Reload the page and try again.');
    const doc=new J.jsPDF({orientation:'landscape',unit:'mm',format:'a4'}),W=doc.internal.pageSize.getWidth(),H=doc.internal.pageSize.getHeight(),s=pdfSafe;
    const cell=c=>(c&&typeof c==='object')?{...c,content:s(c.content)}:s(c);
    const now=new Date();
    doc.setFillColor(27,31,42);doc.roundedRect(10,8,W-20,18,2,2,'F');
    doc.setTextColor(255,255,255);doc.setFont('helvetica','bold');doc.setFontSize(15);doc.text(s(o.title),14,15.5);
    doc.setFont('helvetica','normal');doc.setFontSize(8);doc.setTextColor(203,208,220);
    doc.text(doc.splitTextToSize(s(o.sub||''),W*0.6)[0]||'',14,21.5);
    doc.text(s(`Printed: ${show(todayStr())} ${now.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}`),W-14,15,{align:'right'});
    doc.text(s(`Printed by: ${S.user.fullName||S.user.username}`),W-14,21,{align:'right'});
    let y=31;
    if(o.stats&&o.stats.length){
      const n=o.stats.length,gap=3,bw=(W-20-gap*(n-1))/n,col={ok:[21,128,61],warn:[217,119,6],bad:[185,28,28],mute:[156,163,175]};
      o.stats.forEach(([k,v,t],ix)=>{
        const x=10+ix*(bw+gap),c=col[t]||[107,114,128];
        doc.setFillColor(248,249,251);doc.setDrawColor(217,221,229);doc.roundedRect(x,y,bw,13,1.5,1.5,'FD');
        doc.setFillColor(...c);doc.rect(x,y+0.5,1.2,12,'F');
        doc.setFontSize(6.5);doc.setTextColor(107,114,128);doc.text(s(String(k).toUpperCase()),x+4,y+4.5);
        doc.setFont('helvetica','bold');doc.setFontSize(12);doc.setTextColor(...(t&&col[t]?c:[27,31,42]));doc.text(s(v),x+4,y+10.5);doc.setFont('helvetica','normal');
      });
      y+=17;
    }
    const fs=o.fs||7;
    doc.autoTable({head:[o.head.map(cell)],body:o.body.map(r=>r.map(cell)),foot:o.foot?[o.foot.map(cell)]:undefined,showFoot:'lastPage',
      startY:y,margin:{left:10,right:10,top:10,bottom:14},theme:'grid',rowPageBreak:'avoid',
      styles:{font:'helvetica',fontSize:fs,cellPadding:1.6,lineColor:[217,221,229],lineWidth:.15,textColor:[27,31,42],valign:'middle',overflow:'linebreak'},
      headStyles:{fillColor:[44,51,66],textColor:[255,255,255],fontStyle:'bold',fontSize:fs},
      alternateRowStyles:{fillColor:[245,247,250]},footStyles:{fillColor:[236,239,244],textColor:[27,31,42],fontStyle:'bold'},
      columnStyles:o.cols||{},
      didParseCell:d=>{if(o.statusCols&&d.section==='body'&&o.statusCols.includes(d.column.index)){const v=String(d.cell.raw||'');
        if(/^(Completed|Hit)$/.test(v)){d.cell.styles.textColor=[21,128,61];d.cell.styles.fontStyle='bold'}
        else if(/^(Overdue|Miss|Cancelled)$/.test(v)){d.cell.styles.textColor=[185,28,28];d.cell.styles.fontStyle='bold'}
        else if(v==='Pending'){d.cell.styles.textColor=[180,83,9];d.cell.styles.fontStyle='bold'}}}});
    const np=doc.getNumberOfPages();
    for(let i=1;i<=np;i++){doc.setPage(i);doc.setFont('helvetica','normal');doc.setFontSize(8);doc.setTextColor(107,114,128);doc.text(`Page ${i} of ${np}`,W-10,H-6,{align:'right'});doc.text(s(o.title),10,H-6)}
    doc.save(String(o.name||o.title).replace(/[^\w\- ]+/g,'').trim().replace(/\s+/g,'_')+'_'+new Date().toISOString().slice(0,10)+'.pdf');
    toast('PDF downloaded.');
  }catch(e){toast(e.message||'Could not create the PDF.',1)}
}

/* Last-seen lists are kept in this browser so the next visit shows data instantly, then refreshes quietly. */
const warmKey=()=>'plates_warm_'+(S.user?S.user.username:'');
function warmSave(k,d){if(!S.user)return;try{const w=JSON.parse(localStorage.getItem(warmKey())||'{}');w[k]=d;localStorage.setItem(warmKey(),JSON.stringify(w))}catch(e){}}

async function api(action,data={},quiet){
  const isW=!['login','plates','orders','options','users','jobs','accountRequests','warm'].includes(action);if(isW)S.wv=(S.wv||0)+1;   // lets the auto refresh ignore a read that was overtaken by a save
  const VK=['jobs','plates','orders'],curOf=a=>({jobs:S.jobs,plates:S.plates,orders:S.orders})[a];
  let since='';
  if(quiet&&VK.includes(action)){const vr=S._vr&&S._vr[action];if(vr&&vr.ref&&curOf(action)===vr.ref)since=vr.ver}   // only when the page still holds exactly the data that version describes
  try{
    let j;
    for(let t=0;t<3;t++){                       // server busy (another save running) or Google sent an error page? wait and retry automatically
      const r=await fetch(API_URL,{method:'POST',body:JSON.stringify({action,token:S.token,ver:APP_VERSION,key:APP_KEY,...(since?{since}:{}),...data})});
      const txt=await r.text();
      try{j=JSON.parse(txt)}catch(_){j={ok:false,error:'html'}}
      if(j.ok||(j.error!=='busy'&&j.error!=='html'))break;
      await new Promise(res=>setTimeout(res,j.error==='html'?1200*(t+1):1500));
    }
    if(j.update){showUpdate(j.version);throw new Error('This page is out of date. Please reload it.')}
    if(!j.ok&&j.error==='html')throw new Error('The server sent a Google error page instead of data. In Apps Script, redeploy as a NEW VERSION with access set to Anyone, check that the API_URL is the latest /exec link, then try again.');
    if(!j.ok&&j.error==='busy')throw new Error('Server is busy with another save. Please wait a few seconds and try again.');
    if(!j.ok){ if(j.error==='session'){logout();throw new Error('Session expired. Please sign in again.')} throw new Error(j.error) }
    if(j.same){const cur=curOf(action);if(cur){S.at[action]=Date.now();return{ok:true,data:cur,same:true}}}     // nothing changed on the server: no download, no redraw
    if(/^(saveProject|deleteProjects|toggleStage|setFlag|sendToLSD|addLSD|addLsdQty|cancelLsd|cancelProject|deleteLsd|toggleLsd|saveLSD)$/.test(action)){delete S.cache.jobs;S.at.jobs=0}          // Job Order change: only the Job Order list is stale
    else if(!['login','plates','orders','options','users','jobs','accountRequests','warm'].includes(action)){delete S.cache.plates;delete S.cache.orders;S.at.plates=S.at.orders=0} // Plates change: only the Plates lists are stale
    if(action==='jobs')lsdFix(j.data);
    if(action==='plates'||action==='orders'||action==='jobs'){warmSave(action,j.data);S.at[action]=Date.now();if(j.ver){S._vr=S._vr||{};S._vr[action]={ver:j.ver,ref:j.data}}}
    if(action==='warm'&&j.data){['plates','orders'].forEach(k=>{if(Array.isArray(j.data[k])){S.cache[k]=j.data[k];S.at[k]=Date.now();warmSave(k,j.data[k])}})}
    return j;
  }catch(e){ if(!quiet)toast(e.message==='Failed to fetch'?'Cannot reach the server. Check API_URL and deployment access.':e.message,1); throw e }
  finally{ if(isW)S.wv=(S.wv||0)+1 }
}

/* ====== AUTO LOGOUT after 5 minutes without activity ====== */
const IDLE_MS=5*60*1000;
var idleT=null,lastActive=Date.now();
function idleReset(){
  if(!S.token)return;
  const n=Date.now();if(n-lastActive<1000&&idleT)return;      // light throttle for mousemove
  lastActive=n;clearTimeout(idleT);idleT=setTimeout(idleOut,IDLE_MS);
}
function idleOut(){
  if(!S.token)return;
  ['modal','dlg','toast'].forEach(id=>{const e=document.getElementById(id);if(e)e.hidden=true});
  logout();$('#le').textContent='You were logged out after 5 minutes of inactivity. Please sign in again.';
}

const ntfIcon=k=>k==='lsd'?'LSD':'NEW';
function ntfIn(list){                              // admin: new project / LSD notifications from the server (login + every chat check)
  if(!S.user||S.user.role!=='admin'||!Array.isArray(list))return;
  const old=new Set((S.ntf||[]).map(x=>x.i)),fresh=list.filter(x=>!old.has(x.i));
  S.ntf=list;fuBadge();
  if(fresh.length&&S.ntfReady){                     // something arrived while the admin is working
    const f=fresh[fresh.length-1];toast((f.n||f.u)+': '+f.x);
    try{if(navigator.vibrate)navigator.vibrate(60)}catch(e){}
  }

}
const fuItems=d=>{
  const P=(d&&d.projects)||[],L=(d&&d.lsd)||[],ok=x=>x.followUp&&x.status!=='Completed'&&x.status!=='Cancelled';
  return [...P.filter(ok),...L.filter(ok).map(l=>{const p=P.find(x=>String(x.id)===String(l.projectId))||{};return{...p,projectName:(p.projectName||'')+' (LSD)'}})];
};
const fuUpd=d=>{                                     // USER: items this user followed up that the admin has since changed (until marked as read)

  return [...P.filter(mine).map(p=>({...p,_k:'project',_id:p.id,_n:[1,2,3,4,5].filter(i=>p['s'+i]).length,_of:5})),
          ...L.filter(mine).map(l=>{const p=P.find(x=>String(x.id)===String(l.projectId))||{};return{...p,...l,projectName:(p.projectName||'')+' (LSD)',_k:'lsd',_id:l.lsdId,_n:[1,2,3,4,5,6,7].filter(i=>l['l'+i]).length,_of:7}})];

const JOV=['jnew','jp','jl'],STV=['settings','accounts'];

    jo:[...(adm?[['jnew','New Project']]:[]),['jp','Project Monitoring'],['jl','LSD Monitoring']],

$('#top').onclick=e=>{const m=e.target.dataset.m;if(m)go(S.last[m]||firstOf(m))};

async function go(v){
  if(v==='jnew'&&S.user&&S.user.role!=='admin')v='jp';       // New Project tab is admin only
  const my=++S.nav;S.view=v;S.clearSel=null;S.resetSort=null;S.rowLim=0;S.last[modOf(v)]=v;renderNav();
  const key={plates:'plates',log:'plates',monitor:'orders',jp:'jobs',jl:'jobs'}[v];
  const loading=()=>{$('#main').innerHTML='<p class="muted">Loading…</p>'};
  const stale=key&&(!S.cache[key]||Date.now()-(S.at[key]||0)>20000);   // data fetched in the last 20s is reused: tab switches are instant
  const fresh=stale?api(key).then(j=>j.data):null;                     // otherwise start fetching right away
  try{
    if(v==='plates'||v==='order'||v==='jnew')await S.optsP;           // dropdown choices (loaded at login)
    if(v==='settings'||v==='accounts'){
      loading();
      if(v==='settings'){if(Date.now()-(S.optsAt||0)>60000)await loadOpts()}else S.users=(await api('users')).data;
    }else if(key){
      if(S.cache[key]){                                   // show saved data instantly, refresh quietly
        S[key]=S.cache[key];VIEWS[v]();
        if(!fresh)return;
        const d=await fresh;S.cache[key]=d;
        if(S.nav===my&&JSON.stringify(d)!==JSON.stringify(S[key])){S[key]=d;REDRAW[v]()}
        return;
      }
      loading();
      S[key]=S.cache[key]=await fresh;
    }
    if(S.nav!==my)return;
    VIEWS[v]();
  }catch(e){if(S.nav===my)$('#main').innerHTML='<p class="muted">Could not load data.</p>'}
}

  $('.flt').addEventListener('change',e=>{if(e.target.classList.contains('pk'))setTimeout(draw,0)});                  // picked from the calendar
  $('#fClear').onclick=()=>{$('#ld').value='';$('#ldk').value='createdAt';document.querySelectorAll('.flt [data-f]').forEach(el=>el.value='');sortKey='';sortAsc=true;$('#q').value='';draw()};
  $('#lt').onchange=e=>{
    if(e.target.id==='selAll'){vis.forEach(p=>e.target.checked?S.picked.add(p.id):S.picked.delete(p.id));return draw()}
    const id=e.target.dataset.id;if(!id)return;
    e.target.checked?S.picked.add(id):S.picked.delete(id);
    e.target.closest('tr').classList.toggle('on',e.target.checked);renum($('#lt'),S.picked,'data-id');count();
  };

  S.clearSel=()=>{if(!S.picked.size)return;S.picked.clear();$('#lt').querySelectorAll('input[data-id]').forEach(c=>{c.checked=false;const r=c.closest('tr');if(r)r.classList.remove('on')});renum($('#lt'),S.picked,'data-id');count()};
  $('#prtLog').onclick=async()=>{                     // prints the ticked rows, or everything currently shown (same layout as PRINT PENDING)
    const sel=vis.some(p=>S.picked.has(p.id));
    const rows=sel?inRank(S.picked,vis,p=>p.id):vis;     // selected rows print in the order they were ticked
    if(!rows.length)return toast('Nothing to print.',1);
    const mode=await askOutput('Plates Log'+(sel?' (selected plates)':' (all plates shown)'));if(!mode)return;
    const ci=F.findIndex(f=>f[0]==='totalPlates'),tot=rows.reduce((n,r)=>n+(parseFloat(r.totalPlates)||0),0),now=new Date();
    const parts=[];
    const di=$('#ld').value.trim();if(toIso(di))parts.push($('#ldk').selectedOptions[0].text+': '+di);
    document.querySelectorAll('.flt [data-f]').forEach(el=>{if(el.value)parts.push(el.closest('label').firstChild.textContent.trim()+': '+el.value)});
    if($('#q').value.trim())parts.push('Search: '+$('#q').value.trim());
    if(mode==='download')return downloadPdf({name:'Plates Log',title:'PLATES LOG',sub:(sel?'Selected plates only, in selection order':'All plates shown')+(parts.length?' | '+parts.join(' | '):''),
      head:[...(sel?['#']:[]),...F.map(f=>f[1]),'Date Received'],body:rows.map((r,ri)=>[...(sel?[ri+1]:[]),...F.map(f=>disp(f[2],r[f[0]])),show(r.createdAt)]),
      foot:[{content:`GRAND TOTAL  (${rows.length} item${rows.length===1?'':'s'})`,colSpan:ci+(sel?1:0),styles:{halign:'right'}},String(tot),{content:'',colSpan:F.length-ci}],fs:6.5});
    $('#printArea').innerHTML=`<div class="rh"><div><h2 style="margin:0;font-size:18px">PLATES LOG</h2><div style="font-size:11px">${sel?'Selected plates only, in selection order':'All plates shown'}${parts.length?' · '+esc(parts.join(' · ')):''}</div></div>
      <div style="font-size:11px;text-align:right">Printed: ${show(todayStr())} ${now.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}<br>Printed by: ${esc(S.user.fullName||S.user.username)}</div></div>
      <table class="pt"><thead><tr>${sel?'<th>#</th>':''}${F.map(f=>`<th>${f[1]}</th>`).join('')}<th>Date Received</th></tr></thead>
      <tbody>${rows.map((r,ri)=>`<tr>${sel?`<td>${ri+1}</td>`:''}${F.map(f=>`<td>${esc(disp(f[2],r[f[0]]))}</td>`).join('')}<td>${esc(show(r.createdAt))}</td></tr>`).join('')}</tbody>
      <tfoot><tr><td colspan="${ci+(sel?1:0)}" style="text-align:right">GRAND TOTAL &nbsp;(${rows.length} item${rows.length===1?'':'s'})</td><td>${tot}</td><td colspan="${F.length-ci}"></td></tr></tfoot></table>`;
    window.print();
  };
  $('#addOrd').onclick=()=>{
    const chosen=S.plates.filter(p=>S.picked.has(p.id)&&!S.cart.some(c=>c.id===p.id));
    if(!chosen.length)return toast(S.picked.size?'Those plates are already in your order.':'Tick at least one plate to add.',1);
    chosen.forEach(p=>{const c={...p};c.dateRequest=todayStr();c.dateNeeded='';S.cart.push(c)});
    S.picked.clear();toast(`${chosen.length} item(s) added to order. Set the Date Needed for each.`);go('order');
  };
  const dp=$('#delPl');
  if(dp)dp.onclick=async()=>{
    if(S.user.role!=='admin')return;
    if(!S.picked.size)return toast('Tick at least one plate first.',1);
    if(!(await askDelete(`${S.picked.size} selected plate(s) will be permanently removed from the log.\nThis cannot be undone.`)))return;
    if(dp.disabled)return;dp.disabled=true;
    try{
      const j=await api('deletePlates',{ids:[...S.picked]});S.picked.clear();
      toast(`${j.done} plate(s) deleted.`);go('log');
    }catch(e){dp.disabled=false}
  };
  if($('#notRec'))$('#notRec').onclick=async()=>{
    if(!S.picked.size)return toast('Tick at least one plate first.',1);

      go('log');
    }catch(e){b.disabled=false}
  };
},

/* --- Plates Order (works like a shopping cart; kept after reload) --- */
order(){
  S.cartIdx=null;S.csel=new Set();
  $('#main').innerHTML=`<h2>Plates Order</h2><div class="split">
    ${formHtml('o_','<button class="pri" id="oa">ADD</button><button class="pri" id="ou" disabled>UPDATE</button><button id="oc">CANCEL</button>')}
    <div><div id="ot"></div><div class="bar"><button id="delSel">DELETE</button><button class="pri" id="sub">SUBMIT</button></div></div></div>`;
  setF('o_');
  const upd=()=>{
    const n=S.csel.size,a=$('#cAll');
    $('#delSel').textContent=n?`DELETE (${n})`:'DELETE';
    const sb=$('#sub');if(sb&&!sb.disabled)sb.textContent=n?`SUBMIT (${n})`:'SUBMIT';
    if(a){a.checked=S.cart.length>0&&n===S.cart.length;a.indeterminate=n>0&&n<S.cart.length}
  };
  const draw=()=>{
    saveCart();renderNav();
    $('#ot').innerHTML=tbl(sortRows(S.cart,SORTS.ord,plateVal),'<label style="display:flex;gap:6px;align-items:center;margin:0"><input type="checkbox" id="cAll" style="width:auto;margin:0"> Action</label>',
      r=>{const i=S.cart.indexOf(r);return `<span style="display:inline-flex;gap:6px;align-items:center"><input type="checkbox" data-s="${i}" ${S.csel.has(i)?'checked':''} style="width:auto;margin:0" aria-label="Select line">${S.csel.has(i)?`<b class="rk">${[...S.csel].indexOf(i)+1}</b>`:''} <button class="sm" data-c="${i}">Customize</button></span>`},
      r=>S.csel.has(S.cart.indexOf(r)),[],curSort('ord'));
    upd();
  };
  const mode=ed=>{$('#oa').disabled=ed;$('#ou').disabled=!ed};            // ADD a new line / UPDATE the line being customized
  const reset=()=>{S.cartIdx=null;setF('o_');mode(false)};
  draw();
  $('#oc').onclick=async()=>{if(await askCancel('Anything you typed will not be saved.'))reset()};
  $('#oa').onclick=()=>{
    const o=getF('o_');if(!valid(o))return;
    S.cart.push(o);S.csel=new Set();toast('Line added.');
    reset();draw();
  };
  $('#ou').onclick=()=>{
    if(S.cartIdx==null)return toast('Click Customize on a line first.',1);
    const o=getF('o_');if(!valid(o))return;
    S.cart[S.cartIdx]=o;toast('Line updated.');
    reset();draw();
  };
  $('#ot').onclick=e=>{
    const c=e.target.dataset.c;
    if(c!=null){S.cartIdx=+c;setF('o_',S.cart[c]);mode(true);$('#o_dateNeeded').focus()}
  };
  $('#ot').onchange=e=>{
    if(e.target.id==='cAll'){S.csel=e.target.checked?new Set(S.cart.map((_,i)=>i)):new Set();return draw()}
    const i=e.target.dataset.s;if(i==null)return;
    e.target.checked?S.csel.add(+i):S.csel.delete(+i);     // a Set keeps the order you tick = the rank (1, 2, 3...)
    draw();
  };
  rowToggle($('#ot'));sortClick($('#ot'),'ord',draw);
  S.resetSort=()=>{if(SORTS.ord){delete SORTS.ord;draw()}};
  S.clearSel=()=>{if(!S.csel.size)return;S.csel=new Set();draw()};
  $('#delSel').onclick=async()=>{
    if(!S.csel.size)return toast('Tick the lines you want to delete.',1);
    if(!(await askDelete(`${S.csel.size} selected line(s) will be removed from your order.`)))return;
    S.cart=S.cart.filter((_,i)=>!S.csel.has(i));S.csel=new Set();reset();draw();
  };
  $('#sub').onclick=async()=>{
    if(!S.cart.length)return toast('Add at least one line first.',1);
    const idx=S.csel.size?[...S.csel].filter(i=>S.cart[i]):S.cart.map((_,i)=>i),items=idx.map(i=>S.cart[i]);   // ticked lines in the order ticked; nothing ticked = every line
    items.forEach(o=>{if(!String(o.revisionNo==null?'':o.revisionNo).trim())o.revisionNo='001'});   // forgot the Revision No.? it becomes 001
    const bad=items.findIndex(o=>!o.dateNeeded||!o.totalPlates);
    if(bad>-1)return toast(`Line ${idx[bad]+1} needs a Date Needed and Total Plates. Use Customize.`,1);
    const bt=$('#sub');if(bt.disabled)return;bt.disabled=true;bt.textContent='SUBMITTING…';
    try{
      const sig=JSON.stringify(items);if(S.batchSig!==sig)S.batch=null;S.batchSig=sig;
      S.batch=S.batch||Math.random().toString(36).slice(2)+Date.now();
      await api('submitOrder',{items,batchId:S.batch});
      const done=new Set(idx);S.cart=S.cart.filter((_,i)=>!done.has(i));     // unticked lines stay in your order
      S.csel=new Set();S.batch=null;S.batchSig=null;saveCart();toast(`${items.length} item(s) submitted.`);go('monitor');
    }catch(e){bt.disabled=false;upd()}
  };
},

/* --- Plates Monitoring --- */
monitor(){
  const adm=S.user.role==='admin';
  const base=S.orders.filter(o=>!(o.status==='Received'&&recTime(o.receivedDate)&&Date.now()-recTime(o.receivedDate)>HIDE_MS));
  const arrange=()=>SORTS.mon?sortRows(base,SORTS.mon,plateVal):[...base].reverse().sort((a,b)=>(a.status==='Received')-(b.status==='Received')||String(b.orderDate).localeCompare(a.orderDate));   // pending first, newest on top
  let rows=arrange();
  S.mpick=new Set([...(S.mpick||[])].filter(id=>rows.some(r=>String(r.orderId)===String(id))));
  $('#main').innerHTML=`<h2>Plates Monitoring</h2><div class="bar" style="margin:-4px 0 12px"><button class="pri" id="prt">PRINT PENDING</button>${adm?'<button id="delOrd">DELETE</button>':''}</div><div id="mt"></div>`;
  const nSel=rec=>[...S.mpick].filter(id=>{const o=S.orders.find(x=>String(x.orderId)===id);return o&&(o.status==='Received')===rec}).length;
  const count=()=>{
    const n=S.mpick.size,d=$('#delOrd'),a=$('#mAll'),pb=$('#prt');
    if(d)d.textContent=n?`DELETE (${n})`:'DELETE';
    if(pb)pb.textContent=n?`PRINT SELECTED (${n})`:'PRINT PENDING';
    const np=nSel(false),nr=nSel(true),mt=$('#mt');                 // a row button works on every ticked row, so it shows how many
    if(mt){
      mt.querySelectorAll('button[data-id]').forEach(b=>{b.textContent=S.mpick.has(b.dataset.id)&&np>1?`Received (${np})`:'Received'});
      mt.querySelectorAll('button[data-un]').forEach(b=>{b.textContent=S.mpick.has(b.dataset.un)&&nr>1?`Unreceive (${nr})`:'Unreceive'});
    }
    if(a){a.checked=rows.length>0&&n===rows.length;a.indeterminate=n>0&&n<rows.length}
  };
  const draw=()=>{
    rows=arrange();const rkp=rkm(S.mpick);
    $('#mt').innerHTML=tbl(rows,'<label style="display:flex;gap:6px;align-items:center;margin:0"><input type="checkbox" id="mAll" style="width:auto;margin:0"> Action</label>',r=>
      `<input type="checkbox" data-sel="${r.orderId}" ${S.mpick.has(String(r.orderId))?'checked':''} aria-label="Select order" style="width:auto;margin:0 6px 0 0;vertical-align:middle">${rkp(r.orderId)}`+
      (r.status==='Received'
        ?(adm?`<button class="sm" data-un="${r.orderId}">Unreceive</button> `:'')+`<span class="tag">Received ${esc(recShow(r.receivedDate))}</span> <span class="muted">by ${esc(obn(r))}</span>`
        :(adm?`<button class="pri sm" data-id="${r.orderId}">Received</button> <button class="sm" data-cu="${r.orderId}">Customize</button> `:'')+`<span class="muted">by ${esc(obn(r))}</span>`),
      r=>S.mpick.has(String(r.orderId)),[],curSort('mon'));
    count();
  };
  draw();
  $('#mt').onchange=e=>{
    if(e.target.id==='mAll'){S.mpick=e.target.checked?new Set(rows.map(r=>String(r.orderId))):new Set();return draw()}
    const id=e.target.dataset.sel;if(!id)return;
    e.target.checked?S.mpick.add(id):S.mpick.delete(id);
    e.target.closest('tr').classList.toggle('on',e.target.checked);renum($('#mt'),S.mpick,'data-sel');count();
  };
  rowToggle($('#mt'));sortClick($('#mt'),'mon',draw);
  S.resetSort=()=>{if(SORTS.mon){delete SORTS.mon;draw()}};
  S.clearSel=()=>{if(!S.mpick.size)return;S.mpick=new Set();$('#mt').querySelectorAll('input[data-sel]').forEach(c=>{c.checked=false;const r=c.closest('tr');if(r)r.classList.remove('on')});renum($('#mt'),S.mpick,'data-sel');count()};
  const dd=$('#delOrd');
  if(dd)dd.onclick=async()=>{
    if(S.user.role!=='admin')return;
    if(!S.mpick.size)return toast('Tick at least one order first.',1);
    if(!(await askDelete(`${S.mpick.size} selected order(s) will be permanently removed.\nThis cannot be undone.`)))return;
    if(dd.disabled)return;dd.disabled=true;
    try{
      const j=await api('deleteOrders',{ids:[...S.mpick]});S.mpick=new Set();
      toast(`${j.done} order(s) deleted.`);go('monitor');
    }catch(err){dd.disabled=false}
  };
  $('#prt').onclick=async()=>{
    const sel=S.mpick.size>0;
    const pend=sel?inRank(S.mpick,S.orders,o=>o.orderId):S.orders.filter(o=>o.status!=='Received');   // selected = in the order ticked
    if(!pend.length)return toast('Nothing to print.',1);
    const mode=await askOutput(sel?'Selected plates orders':'Pending plates orders');if(!mode)return;
    if(!sel)pend.sort((x,y)=>String(x.dateNeeded).localeCompare(y.dateNeeded)||String(x.dateRequest).localeCompare(y.dateRequest));
    const ci=F.findIndex(f=>f[0]==='totalPlates');
    const tot=pend.reduce((n,r)=>n+(parseFloat(r.totalPlates)||0),0);
    const now=new Date();
    if(mode==='download')return downloadPdf({name:sel?'Selected Plates Orders':'Pending Plates Orders',title:sel?'SELECTED PLATES ORDERS':'PENDING PLATES ORDERS',sub:sel?'Selected orders only, in selection order':'Orders not yet received, sorted by Date Needed',
      head:[...(sel?['#']:[]),...F.map(f=>f[1]),'Ordered by',...(sel?['Status']:[])],body:pend.map((r,ri)=>[...(sel?[ri+1]:[]),...F.map(f=>disp(f[2],r[f[0]])),obn(r),...(sel?[r.status==='Received'?'Received':'Pending']:[])]),
      foot:[{content:`GRAND TOTAL  (${pend.length} order${pend.length===1?'':'s'})`,colSpan:ci+(sel?1:0),styles:{halign:'right'}},String(tot),{content:'',colSpan:F.length-ci+(sel?1:0)}],fs:6.5});
    $('#printArea').innerHTML=`<div class="rh"><div><h2 style="margin:0;font-size:18px">${sel?'SELECTED PLATES ORDERS':'PENDING PLATES ORDERS'}</h2><div style="font-size:11px">${sel?'Selected orders only, in selection order':'Orders not yet received, sorted by Date Needed'}</div></div>
      <div style="font-size:11px;text-align:right">Printed: ${show(todayStr())} ${now.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}<br>Printed by: ${esc(S.user.fullName||S.user.username)}</div></div>
      <table class="pt"><thead><tr>${sel?'<th>#</th>':''}${F.map(f=>`<th>${f[1]}</th>`).join('')}<th>Ordered by</th>${sel?'<th>Status</th>':''}</tr></thead>
      <tbody>${pend.map((r,ri)=>`<tr>${sel?`<td>${ri+1}</td>`:''}${F.map(f=>`<td>${esc(disp(f[2],r[f[0]]))}</td>`).join('')}<td>${esc(obn(r))}</td>${sel?`<td>${r.status==='Received'?'Received':'Pending'}</td>`:''}</tr>`).join('')}</tbody>
      <tfoot><tr><td colspan="${ci+(sel?1:0)}" style="text-align:right">GRAND TOTAL &nbsp;(${pend.length} order${pend.length===1?'':'s'})</td><td>${tot}</td><td colspan="${F.length-ci+(sel?1:0)}"></td></tr></tfoot></table>`;
    window.print();
  };
  $('#mt').onclick=async e=>{
    const b=e.target;
    const cu=b.dataset.cu;
    if(cu){
      if(S.user.role!=='admin')return;
      const o=S.orders.find(x=>String(x.orderId)===cu);if(!o)return;
      const m=$('#modal');
      m.innerHTML=formHtml('m_','<button id="mx">Cancel</button><button class="pri" id="ms">Save changes</button>').replace('<div class="card form">','<div class="card form"><h3 class="full" style="margin:0">Customize order</h3>');
      m.hidden=false;setF('m_',o);
      $('#mx').onclick=async()=>{if(await askCancel('Anything you typed will not be saved.'))m.hidden=true};
      $('#ms').onclick=async()=>{
        const v=getF('m_');if(!valid(v))return;
        const sb=$('#ms');if(sb.disabled)return;sb.disabled=true;
        try{await api('updateOrder',{item:{...v,orderId:cu}});m.hidden=true;toast('Order updated.');go('monitor')}
        catch(err){sb.disabled=false}
      };
      return;
    }
    const un=b.dataset.un;
    if(un){                                           // admin: a received row shows UNRECEIVE instead of RECEIVED
      if(S.user.role!=='admin'||b.disabled)return;
      const ids=S.mpick.has(un)&&nSel(true)>1?[...S.mpick].filter(id=>{const o=S.orders.find(x=>String(x.orderId)===id);return o&&o.status==='Received'}):[un];
      if(!(await ask(ids.length>1?`Unreceive ${ids.length} selected orders?\nThey go back to Pending and are removed from Plates Log.`:'Unreceive this order?\nIt goes back to Pending and is removed from Plates Log.','Unreceive')))return;
      b.disabled=true;b.textContent='Saving…';
      try{const j=await api('unreceiveOrders',{ids});S.mpick=new Set();toast(j.done?`${j.done} order(s) moved back to Pending.`+(j.skipped?` ${j.skipped} skipped.`:''):'No change. Those orders were not received.',!j.done);go('monitor')}
      catch(err){b.disabled=false;count()}
      return;
    }
    const id=b.dataset.id;if(!id||b.disabled)return;
    const ids=S.mpick.has(id)&&nSel(false)>1?[...S.mpick].filter(x=>{const o=S.orders.find(y=>String(y.orderId)===x);return o&&o.status!=='Received'}):[id];
    if(!(await ask(ids.length>1?`Mark ${ids.length} selected orders as received?\nThey will be added to Plates Log.`:'Mark this order as received? It will be added to Plates Log.','Mark received')))return;
    b.disabled=true;b.textContent='Saving…';
    try{
      if(ids.length>1){const j=await api('receiveMany',{ids});S.mpick=new Set();toast(`${j.done} order(s) received. Added to Plates Log.`+(j.skipped?` ${j.skipped} skipped.`:''))}
      else{await api('receive',{id});toast('Received. Added to Plates Log.')}
      go('monitor');
    }catch(err){b.disabled=false;count()}
  };
}
};

/* ====== JOB ORDER (projects & LSD) ====== */
const JO=(()=>{
  const PST=['Layout Received','Checking layout (Day 1)','Final Artwork (Day 2)','Digital Send to Supplier (Day 3)','Submit to Sales (Day 4)'];
  const LST=['Request by Production','Request Plate Proofing','Request Plate Received','Actual Proofing LSD','Submit to Sales','Received sign by Client','Submit to QA'];
  const J={sel:new Set(),q:'',fs:'',fm:'',fa:'',fp:'',sk:'',so:null,seen:''};
  const P=()=>(S.jobs&&S.jobs.projects)||[],L=()=>(S.jobs&&S.jobs.lsd)||[];
  const isLsd=()=>S.view==='jl',adm=()=>!!S.user&&S.user.role==='admin';
  // long dates such as "Tue Oct 13 2026 00:00:00 GMT+0800 (...)" are turned back into yyyy-mm-dd
  const MON={Jan:1,Feb:2,Mar:3,Apr:4,May:5,Jun:6,Jul:7,Aug:8,Sep:9,Oct:10,Nov:11,Dec:12};
  const nd=v=>{v=v==null?'':String(v);const m=v.match(/^[A-Z][a-z]{2} ([A-Z][a-z]{2}) (\d{1,2}) (\d{4})/);if(m&&MON[m[1]])return m[3]+'-'+String(MON[m[1]]).padStart(2,'0')+'-'+m[2].padStart(2,'0');return fmt(v)};
  const dshow=v=>show(nd(v));
  const pOf=id=>pmOf(id);
  const stat=(o,needed)=>{                              // Project: Overdue = past Date Needed. LSD: Overdue = Actual Proofing done, Submit to Sales not done and the 1-working-day limit has passed
    if(o.status!=='Pending')return o.status;
    if('lsdId' in o)return o.l4&&!o.l5&&lsdDue(o.l4)<todayStr()?'Overdue':'Pending';
    return needed&&nd(needed)<todayStr()?'Overdue':'Pending';
  };
  const jopts=(a,sel,all)=>{a=[...(a||[])];if(sel!=null&&sel!==''&&!a.map(String).includes(String(sel)))a.unshift(sel);return(all?`<option value="">${all}</option>`:'')+a.map(x=>`<option${String(x)===String(sel)?' selected':''}>${esc(x)}</option>`).join('')};
  const uniq=k=>[...new Set([...P(),...L()].map(r=>r[k]).filter(Boolean))].sort();
  const ids=()=>[...J.sel];
  const modal=(h,wide)=>{const m=$('#modal');m.innerHTML=`<div class="card${wide?' wide':''}">${h}</div>`;m.hidden=false};
  const closeM=()=>{$('#modal').hidden=true};
  const cancelM=async()=>{if(await askCancel('Anything you typed will not be saved.'))closeM()};
  function reset(){J.sel.clear();J.q=J.fs=J.fm=J.fa=J.fp=J.sk='';J.so=null;J.seen=''}

  function items(){
    const rs=isLsd()
      ?L().map(l=>{const p=pOf(l.projectId);return{...p,...l,_id:l.lsdId,_s:stat(l,p.dateNeeded),remarks:l.remarks||p.remarks,qty:p.qty,followUp:l.followUp||''}})
      :P().map(p=>({...p,_id:p.id,_s:stat(p,p.dateNeeded)}));
    const q=J.q.toLowerCase();
    const out=rs.filter(r=>(!J.fs||r._s===J.fs)&&(!J.fm||nd(r.dateRequest).slice(0,7)===J.fm)&&(!J.fa||r.artist===J.fa)&&(!J.fp||r.preparedBy===J.fp)&&(!q||Object.values(r).join(' ').toLowerCase().includes(q)));
    const kd=J.sk&&!isLsd()?out.filter(r=>String(r.kind||'')===J.sk):out;   // one kind of project
    return sortRows(kd,J.so,jval);                                           // newest added on top unless a column title was clicked
  }
  const jval=(r,k)=>k==='dateRequest'?nd(r.dateRequest):k==='_prog'?(isLsd()?LST:PST).filter((_,i)=>r[(isLsd()?'l':'s')+(i+1)]).length:r[k];
  async function poll(){                            // automatic refresh: redraws only when the server data really changed
    if(inflight)return;
    const w0=S.wv||0,j=await api('jobs',{},true);
    if(inflight||(S.wv||0)!==w0)return;               // a save happened meanwhile: this read may be old, skip it
    if(JSON.stringify(j.data)===JSON.stringify(S.jobs))return;
    const cb=0,ub=S.user&&S.user.role!=='admin'?fuUpd(S.jobs).length:0;
    S.jobs=S.cache.jobs=j.data;touch();fuBadge();
    if(S.user&&S.user.role!=='admin'&&fuUpd(S.jobs).length>ub)toast('An item you followed up has changes. Click the bell button.',1);
    
    if(S.view==='jnew')recent();else if(S.view==='jp'||S.view==='jl'){fillFilters();paint()}
  }
  async function refresh(bg){                       // re-read the list from the server (quietly, never while a tick is saving)
    if(bg&&inflight)return;
    const j=await api('jobs');
    if(inflight)return;
    S.jobs=S.cache.jobs=j.data;touch();fuBadge();
    if(S.view==='jnew')recent();else if(S.view==='jp'||S.view==='jl'){fillFilters();paint()}
  }

  /* ---------- Project / LSD Monitoring ---------- */
  let inflight=0,pmKey=null,pmap=null;
  const touch=()=>{pmKey=null;try{fuBadge()}catch(e){}};
  const pmOf=id=>{if(pmKey!==S.jobs){pmKey=S.jobs;pmap=new Map(P().map(p=>[String(p.id),p]))}return pmap.get(String(id))||{}};
  const stampNow=()=>{const d=new Date(),q=n=>String(n).padStart(2,'0');return d.getFullYear()+'-'+q(d.getMonth()+1)+'-'+q(d.getDate())+' '+q(d.getHours())+':'+q(d.getMinutes())};
  const shortStamp=v=>fmtDT(v).replace(/ 0(\d:)/,' $1');
  const jfin=(r,lsd,needed)=>{                         // same rule as the server: all stages ticked = Completed (Hit / Miss)
    if(r.status==='Cancelled'){r.result='';return}
    const ks=lsd?['l1','l2','l3','l4','l5','l6','l7']:['s1','s2','s3','s4','s5'];
    if(ks.every(k=>r[k])){r.status='Completed';r.result=lsd?lsdResult(r):(String(r[ks[ks.length-1]]).slice(0,10)<=String(nd(needed))?'Hit':'Miss')}
    else{r.status='Pending';r.result=''}
  };
  const save2cache=()=>{S.cache.jobs=S.jobs;warmSave('jobs',S.jobs)};
  const pushLocal=(it,id)=>{
    if(!S.jobs)S.jobs={projects:[],lsd:[]};
    S.jobs.projects.push({...it,id,status:'Pending',result:'',s1:'',s2:'',s3:'',s4:'',s5:'',followUp:'',forLSD:'',createdBy:S.user.username});
    touch();save2cache();
  };
  const fillFilters=()=>{
    const s=(id,h)=>{const e=$('#'+id);if(e)e.innerHTML=h};
    s('jfs',jopts(['Pending','Overdue','Completed','Cancelled'],J.fs,'All Status'));
    const MN=['January','February','March','April','May','June','July','August','September','October','November','December'];

  async function stage(id,k){                       // tick / untick one stage (admin): shows instantly, saves in the background

  async function act(a){
    const lsd=isLsd();
    const one=()=>{if(ids().length!==1){toast('Select exactly one row.',1);return null}return ids()[0]};

    try{
      if(a==='add')return form();
      if(a==='custom'){                                  // one row selected: open the Customized form filled from that project (as a new item)
        const sid=ids().length===1?ids()[0]:null,src=sid?pmOf(sid):null;
        if(src&&src.id){const c={};['companyCode','projectName','year','category','size','qty','artist','preparedBy','layeredFile','remarks'].forEach(k=>c[k]=src[k]);return form({...c,kind:'Customized',from:src.id})}
        return form({kind:'Customized'})}
      if(a==='view'){const id=one();if(id)return view(id)}
      if(a==='edit'){const id=one();if(id)return form(pmOf(id))}
      if(a==='lsdEdit'){const id=one();if(id)return lsdForm(id)}
      if(a==='del'){
        if(!many())return;const gone=new Set(ids());
        if(!(await askDelete(`${gone.size} project(s) and their LSD records will be removed.\nThis cannot be undone.`)))return;
        await api('deleteProjects',{ids:[...gone]});
        S.jobs.projects=P().filter(p=>!gone.has(String(p.id)));S.jobs.lsd=L().filter(l=>!gone.has(String(l.projectId)));

        const bad=ids().map(i=>pmOf(i)).filter(p=>p.status!=='Completed');
        if(bad.length){await notice(bad.length===1?`"${bad[0].projectName||'This project'}" is not completed yet.\nThe project must be COMPLETED before it can be sent to LSD.`:`${bad.length} of the selected projects are not completed yet (${bad.map(p=>p.projectName).join(', ')}).\nEvery project must be COMPLETED before it can be sent to LSD.`);return}
        const key=p=>['companyCode','projectName','year','category','size','kind','qty'].map(k=>String(p[k]==null?'':p[k]).trim().toLowerCase()).join('|');
        const inLsd=new Set(L().map(l=>key(pmOf(l.projectId))));       // details of everything already in LSD Monitoring
        const sel=ids().map(i=>pmOf(i)),dup=sel.filter(p=>inLsd.has(key(p))),fresh=sel.filter(p=>!inLsd.has(key(p)));
        if(!fresh.length){await notice(dup.length===1?`\"${dup[0].projectName||'This project'}\" is already in LSD Monitoring.\nJust click ADDITIONAL LSD to add more quantity.`:`These ${dup.length} projects are already in LSD Monitoring.\nJust click ADDITIONAL LSD to add more quantity.`,'Already in LSD');return}
        if(!(await ask(`Are you sure you want to request ${fresh.length>1?fresh.length+' projects':'it'} for LSD?`,'Yes, request')))return;
        const j=await api('sendToLSD',{ids:fresh.map(p=>p.id)});J.sel.clear();
        toast((j.done?j.done+' project(s) sent to LSD.':'Already sent to LSD.')+(dup.length?` ${dup.length} skipped (already in LSD).`:''),!j.done);await refresh()}
      if(a==='follow'){                                  // FOLLOW UP: flag / unflag the selected projects (Project page) or LSD items (LSD page)
        if(!many())return;
        const sel=lsd?ids().map(i=>L().find(x=>String(x.lsdId)===i)).filter(Boolean):ids().map(i=>pmOf(i)).filter(p=>p.id);
        const nameOf=r=>(lsd?pmOf(r.projectId).projectName:r.projectName)||'This project',idOf=r=>lsd?r.lsdId:r.id;
        const done=sel.filter(r=>r.status==='Completed');
        if(done.length){await notice(done.length===1?`"${nameOf(done[0])}" is already done.\nA completed project cannot be followed up.`:`${done.length} of the selected items are already done (${done.map(nameOf).join(', ')}).\nA completed project cannot be followed up.`,'Already done');return}
        const on=!sel.every(r=>r.followUp);
        await api('setFlag',{kind:lsd?'lsd':'project',ids:sel.map(idOf),value:on});
        sel.forEach(r=>{r.followUp=on?'1':'';r.followBy=on?S.user.username:'';r.followUpd=''});touch();save2cache();toast(on?'Marked for follow up.':'Follow up removed.');paint()}
      if(a==='print')return printSel();
      if(a==='more'){const id=one();if(id)return lsdQtyForm(id)}
      if(a==='cancelU'&&!adm())return toast('Admin access only.',1);
      if(a==='cancelU'&&!lsd){                          // user: cancel the selected project(s) in Project Monitoring; the admin sees them as cancelled and can restore (edit + save) or delete them
        if(!many())return;
        const sel=ids().map(i=>pmOf(i)).filter(p=>p.id&&p.status!=='Cancelled');
        if(!sel.length)return toast('Those projects are already cancelled.',1);
        if(!(await askCancel(`${sel.length} project(s) will be cancelled.\n${adm()?'They stay in the list marked CANCELLED and are not counted in the total.':'The admin will see them as cancelled.'}`)))return;
        for(const p of sel){await api('cancelProject',{id:p.id});p.status='Cancelled';p.result='';p.followUp=''}
        J.sel.clear();touch();save2cache();toast('Cancelled.');paint();
      }
      if(a==='cancelU'&&lsd){                           // user: cancel the selected LSD item(s); the admin then sees them as cancelled and can delete them
        if(!many())return;
        const sel=ids().map(i=>L().find(x=>String(x.lsdId)===i)).filter(l=>l&&l.status!=='Cancelled');
        if(!sel.length)return toast('Those LSD items are already cancelled.',1);
        if(!(await askCancel(`${sel.length} LSD item(s) will be cancelled.\n${adm()?'They stay in the list marked CANCELLED and are not counted in the total.':'The admin will see them as cancelled.'}`)))return;
        for(const l of sel){await api('cancelLsd',{id:l.lsdId});l.status='Cancelled';jfin(l,true,pmOf(l.projectId).dateNeeded)}
        J.sel.clear();save2cache();toast('Cancelled.');paint();
      }
      if(a==='delL'){                                   // delete the selected LSD item(s)
        if(!many())return;const gone=new Set(ids());
        if(!(await askDelete(`${gone.size} LSD item(s) will be removed.\nThis cannot be undone.`)))return;
        await api('deleteLsd',{ids:[...gone]});
        const pids=new Set(L().filter(l=>gone.has(String(l.lsdId))).map(l=>String(l.projectId)));
        S.jobs.lsd=L().filter(l=>!gone.has(String(l.lsdId)));
        pids.forEach(pid=>{if(!L().some(l=>String(l.projectId)===pid)){const pr=pmOf(pid);if(pr.id)pr.forLSD=''}});   // project can be sent to LSD again
        J.sel.clear();save2cache();toast('Deleted.');render();
      }
    }catch(e){}
  }

  function check(it){

  /* ---------- edit pop-up: every detail on one screen (no scrolling) ---------- */
  const stageBox=(n,label,val)=>`<div class="sb"><label class="stl2"><input type="checkbox" id="st_c${n}"${val?' checked':''}>${esc(label)}</label><div class="dt"><input class="dtt" type="text" inputmode="numeric" id="st_t${n}" maxlength="20" placeholder="mm/dd/yyyy hh:mm AM" autocomplete="off" value="${esc(fmtDT(val))}"><button type="button" class="cal" aria-label="Pick a date"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg></button><input class="pk" type="date" tabindex="-1" aria-hidden="true"></div></div>`;
  const bindStages=(n,names)=>{
    const last={};
    for(let i=1;i<=n;i++){
      const c=$('#st_c'+i),t=$('#st_t'+i);last[i]=t.value;
      c.onchange=()=>{
        if(c.checked){
          for(let j=1;j<i;j++)if(!$('#st_c'+j).checked){c.checked=false;t.value='';notice(`Tick "${names[j-1]}" first.\nThe stages must be checked in order.`,'Check in order');return}
          t.value=t.value||fmtDT(stampNow());
        }else{
          for(let j=i+1;j<=n;j++)if($('#st_c'+j).checked){c.checked=true;t.value=last[i]||fmtDT(stampNow());notice(`Untick "${names[j-1]}" first.\nThe stages must be changed in order.`,'Check in order');return}
          t.value='';
        }
        last[i]=t.value;
      };
      t.onchange=()=>{if(t.value.trim()&&!parseDT(t.value)){toast('Enter the date and time as mm/dd/yyyy hh:mm AM/PM.',1);t.value=last[i]||'';return}c.checked=!!t.value.trim();c.onchange()};

  const orderMsg=(st,pre,names,orig)=>{                  // stages changed in the pop-up must have no gaps

    for(let i=0;i<names.length;i++){if(st[pre+(i+1)]){if(miss>-1)return `Tick "${names[miss]}" before "${names[i]}". The stages must be checked in order.`}else if(miss<0)miss=i}

  const stageErr=(n,names)=>{for(let i=1;i<=n;i++){if($('#st_c'+i).checked&&$('#st_t'+i).value.trim()&&!parseDT($('#st_t'+i).value))return `"${names[i-1]}": enter the date and time as mm/dd/yyyy hh:mm AM/PM.`}return ''};
  const modalBody=p=>{

  };
  async function form(p={}){
    await S.optsP;
    const edit=!!p.id;

    modal(`<h2 style="font-size:20px;margin:0 0 12px">${edit?'Edit':p.kind==='Customized'?'Customized':'New'} Project</h2><div class="jgrid">${modalBody(p)}

      <div class="s3 jinfo">Now: <span class="jpill ${st}">${esc(st)}</span>${p.result?`<span class="jpill ${p.result}">${esc(upL(p.result))}</span>`:''}<span class="muted">Completed is set automatically when every stage is ticked.</span></div>
      <div class="s4 jsec">Stages <span class="muted" style="font-weight:400">tick = done · the date and time can be corrected</span></div><div class="s4 stg">${PST.map((x,i)=>stageBox(i+1,x,p['s'+(i+1)])).join('')}</div>`:''}</div>
    <div class="btns" style="margin-top:14px"><button onclick="JO.cancelM()">Cancel</button><button class="pri" id="jsave">${edit?'Save':p.kind==='Customized'?'Update':'Add item'}</button></div>`,true);

      const b=$('#jsave');if(b.disabled)return;b.disabled=true;

        const j=await api('saveProject',{item:it});
        if(edit){const rec=pmOf(p.id);Object.assign(rec,it);rec.followUp='';jfin(rec,false,rec.dateNeeded);touch();save2cache()}else{pushLocal(it,j.id);
          if(p.from){const src=pmOf(p.from);if(src.id&&src.followUp){try{await api('setFlag',{kind:'project',ids:[src.id],value:false});src.followUp='';touch();save2cache()}catch(e){}}}}   // customized from a followed-up project: its follow up mark is cleared

    else api('jobs').then(j=>{S.jobs=S.cache.jobs=j.data;touch();sugg()}).catch(()=>{});

  return{render,newPage,closeM,cancelM,reset,poll};
})();

/* ====== AUTO REFRESH: every 15 seconds the open page re-reads its data and redraws only if something changed ====== */
(function(){
  let busy=false;
  const KEYS={plates:'plates',log:'plates',monitor:'orders',jp:'jobs',jl:'jobs',jnew:'jobs'};
  async function tick(){
    if(busy||!S.token||!S.user||document.hidden)return;
    busy=true;
    if(S.user.role==='admin'){                                // new account request? the badge counts it and a message appears
      try{const o=S.reqs?S.reqs.length:null;await loadReqs();if(o!=null&&S.reqs&&S.reqs.length>o)toast('New account request waiting for your approval. See the Follow up button.',1)}catch(e){}
    }
    const v=S.view,key=KEYS[v];
    if(!key||!$('#modal').hidden||!$('#dlg').hidden){busy=false;return}      // never redraw under an open pop-up
    try{
      if(key==='jobs')await JO.poll();
      else{
        const w0=S.wv||0,my=S.nav,j=await api(key,{},true);
        if(S.nav===my&&S.view===v&&(S.wv||0)===w0&&JSON.stringify(j.data)!==JSON.stringify(S[key])){S[key]=S.cache[key]=j.data;if(REDRAW[v])REDRAW[v]()}
      }
    }catch(e){}
    busy=false;
  }
  (function loop(){setTimeout(()=>{tick();loop()},25000+Math.random()*10000)})();   // random 25-35 s, so many people never hit the server at the same second              // auto refresh every 30 s (fewer server calls = faster for everyone)
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)tick()});
  window.addEventListener('focus',tick);
})();

/* ====== TEAM CHAT: floating box in the lower left for everyone who is signed in ====== */
const CHAT=(()=>{
  const FAST_MS=3000,OPEN_MS=6000,CLOSED_MS=45000,KEEP=200;   // open + recent chat = 3 s, open + quiet = 6 s, closed = 45 s
  let clr=-1,root,list=[],pend=[],since=0,isOpen=false,unread=0,timer=null,busy=false,online=[],running=false,first=true,built=false,pollErr='',lastMsg=0;
  const me=()=>S.user&&S.user.username;
  const hm=ts=>{const d=new Date(ts),h=d.getHours();return String(h%12||12).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')+' '+(h<12?'AM':'PM')};
  const dayKey=ts=>{const d=new Date(ts);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
  const dayLbl=ts=>{const k=dayKey(ts),t=new Date();if(k===dayKey(t))return'Today';t.setDate(t.getDate()-1);return k===dayKey(t)?'Yesterday':show(k)};
  async function call(action,data){
    let j;
    for(let t=0;t<3;t++){
      const ac=new AbortController(),to=setTimeout(()=>ac.abort(),20000);
      let txt;
      try{const r=await fetch(API_URL,{method:'POST',body:JSON.stringify({action,token:S.token,ver:APP_VERSION,key:APP_KEY,...data}),signal:ac.signal});txt=await r.text()}
      catch(e){throw new Error(e.name==='AbortError'?'The server took too long. Try again.':'Cannot reach the server.')}
      finally{clearTimeout(to)}
      try{j=JSON.parse(txt)}catch(_){throw new Error('The server did not answer. Try again.')}
      if(j.ok||j.error!=='busy')break;                    // "busy" = nothing was saved, so retrying is safe
      await new Promise(res=>setTimeout(res,1200));
    }
    if(j.update){showUpdate(j.version);throw new Error('update')}
    if(!j.ok){if(j.error==='session'&&S.token){logout();toast('Session expired. Please sign in again.',1)}throw new Error(j.error==='busy'?'Server is busy. Please try again.':j.error)}
    return j;
  }
  const $c=s=>root.querySelector(s);
  function build(){
    root=document.createElement('div');root.id='chat';root.hidden=true;
    root.innerHTML=`<button id="chatFab" type="button" aria-label="Open team chat"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.4 8.4 0 0 1-9 8.4 8.8 8.8 0 0 1-3.6-.8L3 21l1.9-5.2A8.4 8.4 0 1 1 21 11.5z"/></svg><span id="chatBadge" hidden></span></button>
<section id="chatBox" hidden role="dialog" aria-label="Team chat"><div class="ch-h"><div><b>Team chat</b><small><i></i><span id="chatOn">0 online</span></small></div><button id="chatX" type="button" aria-label="Close chat">×</button></div>
<div class="ch-who" id="chatWho"></div><div class="ch-list" id="chatList" aria-live="polite"></div><button id="chatNew" type="button" hidden>↓ New messages</button>
<div class="ch-f"><textarea id="chatIn" rows="1" maxlength="400" placeholder="Type a message…" aria-label="Message"></textarea><button class="pri" id="chatSend" type="button">Send</button></div></section>`;
    document.body.appendChild(root);
    $c('#chatFab').onclick=()=>setOpen(true);$c('#chatX').onclick=()=>setOpen(false);
    $c('#chatSend').onclick=send;
    $c('#chatNew').onclick=()=>{scrollEnd();$c('#chatNew').hidden=true};
    $c('#chatList').onscroll=()=>{if(nearEnd())$c('#chatNew').hidden=true};
    const ta=$c('#chatIn');
    ta.onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();send()}else if(e.key==='Escape'){e.preventDefault();setOpen(false)}};
    ta.oninput=()=>{ta.style.height='auto';ta.style.height=Math.min(ta.scrollHeight,96)+'px'};
    document.addEventListener('visibilitychange',()=>{if(running&&!document.hidden){clearTimeout(timer);poll()}});
    document.addEventListener('pointerdown',e=>{if(isOpen&&document.contains(e.target)&&!root.contains(e.target))setOpen(false,true)},true);   // click outside = hide the box
    built=true;
  }
  const nearEnd=()=>{const l=$c('#chatList');return l.scrollHeight-l.scrollTop-l.clientHeight<60};
  const scrollEnd=()=>{const l=$c('#chatList');l.scrollTop=l.scrollHeight};
  function drawBadge(){const b=$c('#chatBadge');b.hidden=!unread;b.textContent=unread>9?'9+':unread}
  function drawOnline(){
    const on=online.some(o=>o.u===me())?online:[{u:me(),n:'You'}].concat(online);
    const names=on.map(o=>o.u===me()?'You':o.n);
    $c('#chatOn').textContent=on.length+' online';
    const w=$c('#chatWho');
    w.textContent=pollErr?'⚠ Reconnecting… ('+pollErr+')':'Online: '+names.join(', ');w.title=w.textContent;w.style.color=pollErr?'var(--bad)':'';
  }
  function draw(stick){
    const l=$c('#chatList'),all=list.concat(pend),keep=l.scrollTop,end=stick||nearEnd();
    if(!all.length){l.innerHTML='<div class="ch-empty">No messages yet.<br>Say hello to your team 👋</div>';return}
    let h='',day='',prev='';
    all.forEach(m=>{
      const ts=m.p?m.at:m.i,k=dayKey(ts),mine=m.u===me();
      if(k!==day){h+=`<div class="cm-d">${esc(dayLbl(ts))}</div>`;day=k;prev=''}
      h+=`<div class="cm${mine?' me':''}${m.p?' pend':''}">${!mine&&prev!==m.u?`<span class="cm-n">${esc(m.n)}</span>`:''}<div class="cm-b">${esc(m.t)}<span class="cm-t">${hm(ts)}</span></div></div>`;
      prev=m.u;
    });
    l.innerHTML=h;
    if(end)scrollEnd();else l.scrollTop=keep;
  }
  function add(msgs,fromPoll){                            // only a poll may move "since" forward (a send must never skip other people's messages)
    const have=new Set(list.map(m=>m.i));let fresh=0,theirs=0;
    msgs.forEach(m=>{if(!have.has(m.i)){list.push(m);fresh++;if(m.u!==me())theirs++}if(fromPoll)since=Math.max(since,m.i)});
    if(!fresh)return;
    lastMsg=Date.now();
    list.sort((a,b)=>a.i-b.i);if(list.length>KEEP)list=list.slice(-KEEP);
    const stick=nearEnd()||!isOpen;
    if(isOpen){draw(false);if(theirs&&!stick)$c('#chatNew').hidden=false;else if(theirs&&stick)scrollEnd()}
    else if(!first&&theirs){unread+=theirs;drawBadge()}
  }
  async function poll(){
    if(!running||busy||!S.token)return;busy=true;
    try{
      const j=await call('chatPoll',{since});
      if(!running)return;
      pollErr='';online=j.online||[];
      if(typeof j.cleared==='number'){                 // an admin cleared the chat: empty the box on every screen
        if(clr>=0&&j.cleared>clr){list=[];unread=0;drawBadge();if(isOpen)draw(true)}
        clr=j.cleared;
      }
      try{if(j.notifs)ntfIn(j.notifs)}catch(e){console.error('notif',e)}
      try{add(j.msgs||[],true)}catch(e){console.error('chat add',e)}
      first=false;
      try{drawOnline();if(!isOpen&&!list.length)draw(true)}catch(e){console.error('chat draw',e)}
    }catch(e){
      if(running&&e.message!=='session'){pollErr=e.message||'error';try{drawOnline()}catch(_){}}
    }finally{busy=false;schedule()}
  }
  function schedule(){clearTimeout(timer);if(running&&!document.hidden)timer=setTimeout(poll,(pollErr?5000:!isOpen?CLOSED_MS:Date.now()-lastMsg<45000?FAST_MS:OPEN_MS)*(0.85+Math.random()*0.3))}
  async function send(){
    const ta=$c('#chatIn'),t=ta.value.trim();if(!t)return;
    const p={p:1,i:'p'+Date.now()+Math.random(),at:Date.now(),u:me(),n:S.user.fullName||me(),t};
    lastMsg=Date.now();pend.push(p);ta.value='';ta.style.height='auto';draw(true);ta.focus();
    try{
      const j=await call('chatSend',{text:t});
      pend=pend.filter(x=>x!==p);add([j.msg],false);draw(true);clearTimeout(timer);timer=setTimeout(poll,300);
    }catch(e){
      pend=pend.filter(x=>x!==p);draw(true);
      if(!ta.value)ta.value=t;                          // give the text back so nothing is lost
      if(e.message!=='session')toast(/unknown action/i.test(e.message)?'Chat is not on the server yet. Paste the new Code_X19.gs and deploy it as a New version.':'Message not sent: '+e.message,1);
    }
  }
  function setOpen(v,noFocus){
    isOpen=v;$c('#chatBox').hidden=!v;$c('#chatFab').hidden=v;
    if(v){unread=0;drawBadge();$c('#chatNew').hidden=true;draw(true);$c('#chatIn').focus();clearTimeout(timer);poll()}
    else{if(!noFocus)$c('#chatFab').focus();schedule()}
  }
  return{
    async clear(){await call('chatClear',{});clearTimeout(timer);poll()},      // admin only (Settings)
    start(){
      if(!built)build();
      clr=-1;list=[];pend=[];since=0;unread=0;first=true;lastMsg=0;online=[];running=true;busy=false;pollErr='';
      root.hidden=false;isOpen=false;$c('#chatBox').hidden=true;$c('#chatFab').hidden=false;$c('#chatIn').value='';
      drawBadge();drawOnline();draw(true);clearTimeout(timer);timer=setTimeout(poll,5000);   // wait 5 s so the first screen loads first
    },
    stop(){                                             // called at the start of logout(), while the token still exists
      if(!running)return;running=false;clearTimeout(timer);
      try{fetch(API_URL,{method:'POST',keepalive:true,body:JSON.stringify({action:'chatBye',token:S.token,ver:APP_VERSION,key:APP_KEY})}).catch(()=>{})}catch(e){}
      if(root)root.hidden=true;
    }
  };
})();

    [/^open project/,'external'],[/^review account/,'clip'],[/^create account/,'userplus'],[/^sign in/,'login'],
    [/^send request/,'send'],[/^send\b/,'send'],[/^add to order/,'cart'],[/^additional lsd/,'layers'],[/^for lsd/,'layers'],
    [/^(add|new)\b/,'plus'],[/^(customi[sz]ed?)\b/,'sliders'],[/^unreceive/,'undo'],[/^follow up/,'bell'],
    [/^print/,'printer'],[/^view\b/,'eye'],[/^edit/,'edit'],[/^delete/,'trash'],[/^download/,'download'],
    [/^(save|save changes)\b/,'save'],[/^(update|refresh|reload)/,'refresh'],[/^clear/,'eraser'],
    [/^reset password/,'key'],[/^(make|remove) super admin/,'shield'],[/^mark as read/,'checkall'],
    [/^show more/,'chevron'],[/^(submit|ok)$/,'check'],[/^(cancel|close|reject|no)$/,'x']
  ];
  function iconFor(t){t=t.toLowerCase();for(const [re,k] of MAP)if(re.test(t))return I[k];return ''}
  function scan(){
    document.querySelectorAll('button').forEach(b=>{
      if(b.classList.contains('hic')||b.id==='usr')return;
      const raw=b.textContent||'',t=raw.replace(/\s+/g,' ').trim();
      if(b.dataset.bk===t&&(b.querySelector(':scope>.bi')||b.dataset.bn==='1'))return;
      b.dataset.bk=t;
      if(b.querySelector('svg')||!/^[A-Za-z]/.test(t)){b.dataset.bn='1';return}
      const s=iconFor(t);
      if(!s){b.dataset.bn='1';return}
      b.dataset.bn='0';b.insertAdjacentHTML('afterbegin',s);
    });
  }
  let raf=0;const sched=()=>{if(!raf)raf=requestAnimationFrame(()=>{raf=0;scan()})};
  new MutationObserver(sched).observe(document.body,{childList:true,subtree:true,characterData:true});
  scan();
})();
</script>
<script id="pwEye">
/* ====== SHOW / HIDE PASSWORD: an eye button inside every password box (also boxes the page draws later) ====== */
(function(){
  const ON='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z" fill="currentColor" fill-opacity=".18"/><circle cx="12" cy="12" r="3"/></svg>';
  const OFF='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3l18 18"/><path d="M10.6 5.1A9.7 9.7 0 0 1 12 5c6 0 10 7 10 7a17 17 0 0 1-3.2 3.9M6.6 6.6A17 17 0 0 0 2 12s4 7 10 7a9.6 9.6 0 0 0 4.2-1M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>';
  function wrap(inp){
    if(inp.dataset.pwe)return;inp.dataset.pwe='1';
    const w=document.createElement('span');w.className='pww';
    inp.parentNode.insertBefore(w,inp);w.appendChild(inp);
    const b=document.createElement('button');b.type='button';b.className='pwe';b.tabIndex=0;
    b.setAttribute('aria-label','Show password');b.title='Show password';b.setAttribute('aria-pressed','false');b.innerHTML=ON;
    b.addEventListener('mousedown',e=>e.preventDefault());           // keep the cursor in the box
    b.addEventListener('click',e=>{
      e.preventDefault();e.stopPropagation();
      const show=inp.type==='password';inp.type=show?'text':'password';
      b.innerHTML=show?OFF:ON;b.setAttribute('aria-pressed',show?'true':'false');
      const t=show?'Hide password':'Show password';b.title=t;b.setAttribute('aria-label',t);
    });
    w.appendChild(b);
  }
  function scan(){document.querySelectorAll('input[type=password]').forEach(wrap)}
  let raf=0;new MutationObserver(()=>{if(!raf)raf=requestAnimationFrame(()=>{raf=0;scan()})}).observe(document.body,{childList:true,subtree:true});
  scan();
  // hide the password again when the sign-in form goes away (sign out / timeout)
  document.addEventListener('visibilitychange',()=>{if(document.hidden)document.querySelectorAll('.pww input').forEach(i=>{if(i.type==='text'&&i.dataset.pwe){i.type='password';const b=i.parentNode.querySelector('.pwe');if(b){b.innerHTML=ON;b.setAttribute('aria-pressed','false')}}})});
})();
</script>
